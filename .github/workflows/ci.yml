name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Native Cargo Tests
        run: cargo test --workspace

      - name: Benchmark Runner (152/152 Corpus Verification)
        run: cargo run -p kiteo-runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Empirical Scaling Validator
        run: python benchmark/empirical/validator.py

      - name: WASM Compilation Check
        run: cargo check -p kiteo-engine --target wasm32-unknown-unknown

  extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extension Install & Build
        run: |
          cd extension
          npm install
          npm run build

  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Website Install & Build
        run: |
          cd website
          npm install
          npm run build

