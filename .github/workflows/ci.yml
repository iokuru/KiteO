name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Native Cargo Tests
        run: cargo test --workspace

      - name: Benchmark Runner (152/152 Corpus Verification)
        run: cargo run -p kiteo-runner

      - name: Dev2 Synthetic Benchmark Evaluation (70 Cases)
        run: cargo run -p kiteo-runner -- --dev2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Empirical Scaling Validator (Synthetic Loops)
        run: python benchmark/empirical/validator.py

      - name: Empirical Scaling Validator (CP Patterns)
        run: python benchmark/empirical/synthetic_pattern_validator.py

      - name: WASM Compilation Check
        run: cargo check -p kiteo-engine --target wasm32-unknown-unknown


  parser-parity:
    name: Parser Parity (Native vs WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Extension Dependencies
        run: |
          cd extension
          npm install

      - name: Build WebAssembly Package
        run: |
          cd engine
          wasm-pack build --target web --out-dir ../extension/src/wasm/pkg

      - name: Run Parser Parity Test (Standard Corpus - 152 Cases)
        run: node benchmark/parity_test.mjs

      - name: Run Parser Parity Test (Dev2 Corpus - 70 Cases)
        run: node benchmark/parity_test.mjs --dev2

      - name: Run AST JSON Parity Test (Standard Corpus - 152 Cases)
        run: node benchmark/ast_parity_test.mjs

      - name: Run AST JSON Parity Test (Dev2 Corpus - 70 Cases)
        run: node benchmark/ast_parity_test.mjs --dev2

      - name: Run Incomplete Code Parity Test
        run: node benchmark/incomplete_code_parity_test.mjs

      - name: Install Playwright Browsers (Chromium & Firefox)
        run: |
          cd extension
          npx playwright install --with-deps chromium firefox

      - name: Run Browser-Level Parity Test (Playwright Chromium & Firefox)
        run: |
          cd extension
          npm run test:browser-parity

  extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebAssembly Package
        run: |
          cd engine
          wasm-pack build --target web --out-dir ../extension/src/wasm/pkg

      - name: Extension Install & Build
        run: |
          cd extension
          npm install
          npm run build

  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Website Install & Build
        run: |
          cd website
          npm install
          npm run build

