    <form action="/problemset/submit/1621/" method="post">
      <textarea name="code" id="target" rows="15" cols="80">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;algorithm&gt;
using namespace std;
int main() {
    int n;
    if (!(cin >> n)) return 0;
    vector<int> a(n);
    for (int i = 0; i < n; i++) cin >> a[i];
    sort(a.begin(), a.end());
    int count = 1;
    for (int i = 1; i < n; i++) {
        if (a[i] != a[i - 1]) count++;
    }
    cout << count << endl;
    return 0;
}</textarea>
